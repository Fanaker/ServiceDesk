services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: servicedesk
      POSTGRES_USER: servicedesk
      POSTGRES_PASSWORD: change-this-local-password
    ports:
      - "5432:5432"
    volumes:
      - servicedesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicedesk"]
      interval: 5s
      retries: 10
volumes:
  servicedesk_pgdata:

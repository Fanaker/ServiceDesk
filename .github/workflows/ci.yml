name: Validate ServiceDesk
on:
  push:
  pull_request:
jobs:
  reference-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile dependency-free Java backend
        run: |
          mkdir -p build
          javac -encoding UTF-8 -d build server/src/servicedesk/Main.java
      - name: Verify REST API and persistence
        run: python3 -m unittest discover -s tests -v
      - name: Validate browser JS syntax
        run: node --check web/assets/app.js
